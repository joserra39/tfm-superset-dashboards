sql: "WITH observado AS (\r\n    SELECT DISTINCT ON (\r\n        fiwareservicepath,\r\
  \n        entityid,\r\n        (dateobserved AT TIME ZONE 'UTC')::date\r\n    )\r\
  \n        fiwareservicepath,\r\n        entityid,\r\n        (dateobserved AT TIME\
  \ ZONE 'UTC')::date AS fecha,\r\n        isdgeneral AS isd_calculado,\r\n      \
  \  isdairquality AS isd_aire_calculado,\r\n        isdnoiselevel AS isd_ruido_calculado,\r\
  \n        isdcrowdflow AS isd_movilidad_calculado,\r\n        isdenergyconsumption\
  \ AS isd_energia_calculado,\r\n        isdwaterquality AS isd_agua_calculado,\r\n\
  \        recvtime AS recepcion_observado\r\n    FROM madrid.isd_districtisdobserved\r\
  \n    WHERE fiwareservicepath = '/isd'\r\n      AND aggregationlevel = 'day'\r\n\
  \    ORDER BY\r\n        fiwareservicepath,\r\n        entityid,\r\n        (dateobserved\
  \ AT TIME ZONE 'UTC')::date,\r\n        recvtime DESC,\r\n        dateobserved DESC\r\
  \n),\r\nprediccion AS (\r\n    SELECT DISTINCT ON (\r\n        fiwareservicepath,\r\
  \n        entityid,\r\n        (dateobserved AT TIME ZONE 'UTC')::date\r\n    )\r\
  \n        fiwareservicepath,\r\n        entityid,\r\n        (dateobserved AT TIME\
  \ ZONE 'UTC')::date AS fecha,\r\n        isdgeneral AS isd_prediccion,\r\n     \
  \   isdairquality AS isd_aire_prediccion,\r\n        isdnoiselevel AS isd_ruido_prediccion,\r\
  \n        isdcrowdflow AS isd_movilidad_prediccion,\r\n        isdenergyconsumption\
  \ AS isd_energia_prediccion,\r\n        isdwaterquality AS isd_agua_prediccion,\r\
  \n        recvtime AS recepcion_prediccion\r\n    FROM madrid.isd_districtisdforecast\r\
  \n    WHERE fiwareservicepath = '/isd'\r\n      AND aggregationlevel = 'day'\r\n\
  \    ORDER BY\r\n        fiwareservicepath,\r\n        entityid,\r\n        (dateobserved\
  \ AT TIME ZONE 'UTC')::date,\r\n        recvtime DESC,\r\n        dateobserved DESC\r\
  \n)\r\nSELECT\r\n    COALESCE(o.entityid, p.entityid) AS district_name,\r\n    COALESCE(o.fecha,\
  \ p.fecha) AS fecha,\r\n    o.isd_calculado,\r\n    p.isd_prediccion,\r\n    o.isd_aire_calculado,\r\
  \n    p.isd_aire_prediccion,\r\n    o.isd_ruido_calculado,\r\n    p.isd_ruido_prediccion,\r\
  \n    o.isd_movilidad_calculado,\r\n    p.isd_movilidad_prediccion,\r\n    o.isd_energia_calculado,\r\
  \n    p.isd_energia_prediccion,\r\n    o.isd_agua_calculado,\r\n    p.isd_agua_prediccion\r\
  \nFROM observado AS o\r\nFULL OUTER JOIN prediccion AS p\r\n    ON  o.fiwareservicepath\
  \ = p.fiwareservicepath\r\n    AND o.entityid = p.entityid\r\n    AND o.fecha =\
  \ p.fecha;"
